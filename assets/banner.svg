<svg fill="none" viewBox="0 0 850 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <linearGradient id="neonGame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f38ba8"/>
      <stop offset="50%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>

    <linearGradient id="borderGame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f38ba8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a6e3a1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#89dceb" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      font-weight: 800;
      font-size: 32px;
      fill: url(#neonGame);
      filter: drop-shadow(0px 2px 8px rgba(243, 139, 168, 0.4));
    }
    .subtitle {
      font-family: "Fira Code", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 500;
      fill: #cdd6f4;
    }
    .tag {
      font-family: "Fira Code", monospace;
      font-size: 13px;
      fill: #a6e3a1;
    }
  </style>

  <rect x="2" y="2" width="846" height="216" rx="20" fill="url(#bgGame)" stroke="url(#borderGame)" stroke-width="2"/>

  <text x="60" y="45" fill="#f9e2af" font-size="20">✦</text>
  <text x="770" y="55" fill="#f9e2af" font-size="24">✦</text>
  <text x="740" y="170" fill="#f9e2af" font-size="16">✧</text>

  <g transform="translate(60, 60)">
    <circle cx="45" cy="45" r="40" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
    <text x="45" y="55" text-anchor="middle" font-size="42">🎮</text>
  </g>

  <g transform="translate(180, 0)">
    <text x="0" y="80" class="title">🌸 moe-game-launcher 🌸</text>
    <text x="0" y="120" class="subtitle">✨ Linux 游戏启动与混合显卡调度工具 · Gamescope 与性能监控支持 ✨</text>
    <text x="0" y="165" class="tag">$ moe-game run -m -g /path/to/game.exe</text>
  </g>
</svg>
