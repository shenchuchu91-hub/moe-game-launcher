# ==============================================================================
#  🌸 Moe MangoHud Theme - Anime Pastel & Neon for Arch Linux 🌸
# ==============================================================================

# 窗口与排版
legacy_layout=false
horizontal=false
round_corners=10
font_size=20
font_scale=1.0
position=top-left
offset_x=16
offset_y=16

# 配色方案 (Catppuccin Mocha + Pastel Pink 萝莉二次元风)
background_alpha=0.65
background_color=1e1e2e
text_color=cdd6f4
gpu_color=f38ba8
cpu_color=89b4fa
vram_color=cba6f7
ram_color=a6e3a1
engine_color=fab387
frametime_color=f9e2af

# 显卡监控 (RTX 5060)
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
vram

# 处理器监控 (i7-13620H)
cpu_stats
cpu_temp
cpu_mhz
cpu_power
ram

# 游戏与帧率表现 (144Hz 屏幕优化)
fps
fps_limit=144,120,60,0
frametime
frame_timing=1

# 实用信息
time
time_format=%H:%M
wine
arch
engine_version
vulkan_driver
resolution
